name: ساخت APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 دریافت کد
      uses: actions/checkout@v4

    - name: 🔧 نصب Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x

    - name: 📦 نصب وابستگی‌ها
      run: |
        npm install
        npm install -g expo-cli eas-cli

    - name: 🏗️ ساخت APK با EAS
      run: |
        export EXPO_TOKEN=${{ secrets.EXPO_TOKEN }}
        npx eas build -p android --profile preview --non-interactive

    - name: 📤 آپلود APK
      uses: actions/upload-artifact@v4
      with:
        name: cafe-lombardi
        path: build-*.apk